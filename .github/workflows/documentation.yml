name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop path:./nix --accept-flake-config --command bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap established Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          determinate: false
      - name: Check step zero rules and examples
        run: python3 scripts/check-step-zero.py
      - name: Test prompt enforcement
        run: node --test scripts/check-prompts.test.mjs
      - name: Check PR prompt history
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-prompts.mjs --base "$PR_BASE_SHA"
      - name: Check whitespace
        run: git diff-tree --check HEAD

name: Retire closed previews
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: pages-tree
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/cleanup-previews.mjs
        env:
          GH_TOKEN: ${{ github.token }}

name: Illustrated stories
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  stories:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: nix develop path:./nix --accept-flake-config --command bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        mode: [verify, generate]
    env:
      CLUSTER_STORY_COHORTS: viewport
      CLUSTER_PINNED_RENDERER: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          determinate: false
      - name: Identify matching verification inputs
        if: matrix.mode == 'verify'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verification-reuse.mjs prepare stories-verify 'stories (verify)'
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'verify'
        with:
          name: verification-input-stories-verify-${{ github.run_attempt }}
          path: ci-evidence/verification/stories-verify/plan.json
      - name: Await matching verification outcome
        id: reused
        if: matrix.mode == 'verify' && steps.reuse.outputs.execute == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verification-reuse.mjs wait stories-verify
      - name: Exact verification
        if: matrix.mode == 'verify' && (steps.reuse.outputs.execute == 'true' || steps.reused.outputs.execute == 'true')
        env:
          # Existing bounded, redacted demo-only probe; retained with story traces.
          CLUSTER_SETTLEMENT_TIMING: "1"
          CLUSTER_SETTLEMENT_RPC_TIMING: "1"
          CLUSTER_EMULATOR_POST_MARKER: "1"
        run: nix run path:./nix#ci-renderer -- stories verify
      - name: Explicit baseline candidates (never acceptance)
        if: matrix.mode == 'generate' && contains(github.event.pull_request.labels.*.name, 'baseline-candidates')
        run: nix run path:./nix#ci-renderer -- stories generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrated-stories-${{ matrix.mode }}-linux-arm64
          include-hidden-files: true
          path: |
            ci-evidence/nix-renderer/
            ci-evidence/verification/
            ci-evidence/settlement-profile/
            test-results/stories/
            test-results/story-tools/
            test-results/.story-cohorts-*/
            firestore-debug.log

name: Publish review build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  pages: write
concurrency:
  group: pages-tree
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PUBLIC_BASE_PATH: /clusterii${{ github.event_name == 'pull_request' && format('/pr{0}', github.event.pull_request.number) || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/publish-pages.mjs
      - name: Request Pages build
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Preview location
        run: echo "Preview https://anicolao.github.io${PUBLIC_BASE_PATH}/" >> "$GITHUB_STEP_SUMMARY"

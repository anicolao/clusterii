name: Publish review build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  pages: write
concurrency:
  group: pages-tree
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop path:./nix --accept-flake-config --command bash -e {0}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PUBLIC_BASE_PATH: /clusterii${{ github.event_name == 'pull_request' && format('/pr{0}', github.event.pull_request.number) || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Bootstrap Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          determinate: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/publish-pages.mjs
      - name: Request Pages build
        if: hashFiles('.pages-publication.json') != ''
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify served revision and assets
        if: hashFiles('.pages-publication.json') != ''
        run: node scripts/verify-pages.mjs "https://anicolao.github.io${PUBLIC_BASE_PATH}/" "$SOURCE_SHA"
      - name: Preview location
        run: echo "Preview https://anicolao.github.io${PUBLIC_BASE_PATH}/" >> "$GITHUB_STEP_SUMMARY"

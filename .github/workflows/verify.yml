name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop path:./nix --accept-flake-config --command bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
        with:
          determinate: false
      - name: Application checks in Nix-provisioned renderer
        run: nix run path:./nix#ci-renderer -- application
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            database-debug.log
            firestore-debug.log
            test-results/
            tests/browser/journey.spec.ts-snapshots/
